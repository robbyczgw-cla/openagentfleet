name: Bug report
description: Report a reproducible product or developer-experience problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, browser profiles, private transcripts or unredacted screenshots.
        Suspected security vulnerabilities belong in the private process in [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the user-visible impact.
      placeholder: A concise description of the failure.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence, selected engine and runtime if relevant.
      placeholder: |
        1. Start...
        2. Select...
        3. Click...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Apple Silicon/Intel, OpenAgentFleet commit or build, runtime and provider.
      placeholder: macOS 15.x · Apple Silicon · commit · Colima · OpenCode
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove tokens, cookies, paths containing private names and personal data.
      render: text
