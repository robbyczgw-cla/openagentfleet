name: Feature request
description: Propose a focused improvement to the OpenAgentFleet product.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is blocked, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful product behavior, including permissions or opt-in settings.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - macOS app
        - Agent Computer
        - Browser client
        - Mobile remote client
        - Controller/API
        - Documentation/developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Permission and security impact
      description: Explain whether this changes host access, credentials, network reachability, approvals or isolation.
    validations:
      required: true
